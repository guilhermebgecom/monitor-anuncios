name: Monitor de anúncios

on:
  schedule:
    - cron: "23 10 * * *"   # todo dia às 10:23 UTC (07:23 em Brasília)
  workflow_dispatch:         # botão "Run workflow" para rodar na hora
    inputs:
      so_planilha:
        description: "Só atualizar a planilha (não coleta anúncios, não gasta créditos)"
        type: boolean
        default: false

permissions:
  contents: write            # salvar o histórico e os relatórios no repositório
  pages: write               # publicar a planilha no GitHub Pages
  id-token: write

concurrency:
  group: monitor-anuncios
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ADS_MONITOR_DIR: dados
      PAINEL_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      SCRAPECREATORS_API_KEY: ${{ secrets.SCRAPECREATORS_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Pillow (miniaturas das capas)
        run: pip install --quiet pillow

      - name: Verificar chave da API
        if: ${{ !inputs.so_planilha }}
        run: |
          if [ -z "$SCRAPECREATORS_API_KEY" ]; then
            echo "::error::Crie o secret SCRAPECREATORS_API_KEY em Settings > Secrets and variables > Actions"
            exit 1
          fi

      - name: Atualizar lista de lojas
        if: ${{ !inputs.so_planilha }}
        run: python scripts/monitor.py sync --file lojas.json

      - name: Coletar anúncios (150 de maior impressão por loja)
        if: ${{ !inputs.so_planilha }}
        run: python scripts/monitor.py run --source scrapecreators --max-ads 150 --sort impressions

      - name: Reagrupar produtos do histórico (regras atuais)
        if: ${{ !inputs.so_planilha }}
        run: python scripts/monitor.py rekey

      - name: Gerar relatório
        if: ${{ !inputs.so_planilha }}
        run: |
          DIA=$(date -u +%F)
          python scripts/monitor.py report --out "relatorios/$DIA.md" --csv-dir relatorios/csv
          cp "relatorios/$DIA.md" relatorios/ultimo.md
          cat relatorios/ultimo.md >> "$GITHUB_STEP_SUMMARY"

      - name: Salvar no repositório
        if: ${{ always() && !inputs.so_planilha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados relatorios criativos
          git diff --cached --quiet || git commit -m "Coleta $(date -u +%F)"
          git push origin HEAD

      - name: Gerar planilha interativa
        run: python scripts/monitor.py painel --out site

      - name: Preparar publicação
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar:
    needs: coletar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publicar planilha no GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
